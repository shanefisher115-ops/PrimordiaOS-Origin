steps:
  # 1. Build the multi-stage Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/antigravity-pipelines:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/antigravity-pipelines:latest'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/antigravity-pipelines:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/antigravity-pipelines:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'antigravity-pipelines'
      - '--image'
      - 'gcr.io/$PROJECT_ID/antigravity-pipelines:$COMMIT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,ANTIGRAVITY_GATEWAY_URL=$_ANTIGRAVITY_GATEWAY_URL,VERTEX_AI_URL=$_VERTEX_AI_URL,PRIMORDIAOS_KERNEL_URL=$_PRIMORDIAOS_KERNEL_URL'

substitutions:
  _DEPLOY_REGION: 'us-central1'
  _ANTIGRAVITY_GATEWAY_URL: 'http://localhost:5055/api/gateway'
  _VERTEX_AI_URL: 'https://generativelanguage.googleapis.com/v1beta'
  _PRIMORDIAOS_KERNEL_URL: 'http://localhost:3000'

images:
  - 'gcr.io/$PROJECT_ID/antigravity-pipelines:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/antigravity-pipelines:latest'

options:
  logging: CLOUD_LOGGING_ONLY

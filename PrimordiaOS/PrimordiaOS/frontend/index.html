<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrimordiaOS Cockpit</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Consolas, monospace;
      color: #e0e0ff;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      pointer-events: none;
    }

    h1, h2 {
      color: #c7a6ff;
      margin: 10px 0;
      pointer-events: auto;
    }

    #topology {
      width: 100%;
      height: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
    }

    .node {
      position: absolute;
      padding: 6px 10px;
      background: rgba(26, 26, 34, 0.9);
      border: 1px solid #555;
      border-radius: 6px;
      color: #e0e0ff;
      font-size: 12px;
      transition: opacity 0.5s;
    }

    .node.offline {
      opacity: 0.3;
    }

    .link {
      position: absolute;
      background: #7f5bff;
      opacity: 0.7;
      height: 2px;
      transform-origin: 0 0;
      transition: opacity 1s;
    }

    .pulse {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf50;
      opacity: 0.8;
      pointer-events: none;
      animation: pulseAnim 0.8s ease-out forwards;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(12); opacity: 0; }
    }

    #events {
      border: 1px solid #444;
      padding: 10px;
      height: 300px;
      overflow-y: scroll;
      background: rgba(17, 17, 17, 0.85);
      pointer-events: auto;
    }

    .event {
      margin-bottom: 8px;
      padding: 6px;
      border-left: 3px solid #9f7fff;
    }
    .heartbeat { border-left-color: #4caf50; }
    .task { border-left-color: #2196f3; }
    .result { border-left-color: #ff9800; }
    .error { border-left-color: #f44336; }
    .register { border-left-color: #9c27b0; }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>

<canvas id="nebula"></canvas>

<div id="ui">
  <h1>PrimordiaOS Swarm Topology</h1>
  <div id="topology"></div>

  <h2>Loop Manager Status</h2>
  <div id="loop-status" style="margin-bottom:20px;">
    <div>Loop Depth: <span id="loop-depth">0</span></div>
    <div>Last Result OK: <span id="loop-ok">true</span></div>
  </div>

  <h2>Realm Health</h2>
  <div id="realm-health" style="margin-bottom:20px;"></div>

  <h1>PrimordiaOS Cockpit</h1>
  <div id="events"></div>
</div>

<script>
  // ---------------------------
  // NEBULA SHADER BACKGROUND
  // ---------------------------
  const canvas = document.getElementById("nebula");
  const gl = canvas.getContext("webgl");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const vertexShaderSrc = `
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSrc = `
    precision highp float;
    uniform float time;
    uniform vec2 resolution;

    float noise(vec2 p){
      return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453);
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      float t = time * 0.05;

      float n = noise(uv * 3.0 + t);
      float r = 0.2 + n * 0.6;
      float g = 0.1 + n * 0.4;
      float b = 0.3 + n * 0.7;

      gl_FragColor = vec4(r, g, b, 1.0);
    }
  `;

  function compileShader(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    return shader;
  }

  const vs = compileShader(gl.VERTEX_SHADER, vertexShaderSrc);
  const fs = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);

  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  gl.useProgram(program);

  const positionLoc = gl.getAttribLocation(program, "position");
  const timeLoc = gl.getUniformLocation(program, "time");
  const resLoc = gl.getUniformLocation(program, "resolution");

  const vertices = new Float32Array([
    -1, -1,
     1, -1,
    -1,  1,
     1,  1
  ]);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

  gl.enableVertexAttribArray(positionLoc);
  gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

  function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);

  // ---------------------------
  // SWARM + COCKPIT LOGIC
  // ---------------------------

  const ws = new WebSocket("ws://localhost:3002");
  const eventsDiv = document.getElementById("events");

  const loopDepthEl = document.getElementById("loop-depth");
  const loopOkEl = document.getElementById("loop-ok");

  const realmHealthEl = document.getElementById("realm-health");
  const realmStatus = {};

  const topology = document.getElementById("topology");
  const nodes = {};
  const orbitState = {}; // NEW: realm → orbit parameters

  function spawnNode(realm) {
    if (nodes[realm]) return;

    const div = document.createElement("div");
    div.className = "node";
    div.textContent = realm;

    // initial position (will be overridden by orbit)
    div.style.left = "200px";
    div.style.top = "200px";

    topology.appendChild(div);
    nodes[realm] = div;

    // initialize orbit parameters
    orbitState[realm] = {
      angle: Math.random() * Math.PI * 2,
      radius: 80 + Math.random() * 120,
      speed: 0.002 + Math.random() * 0.003
    };
  }

  function updateOrbits() {
    const centerX = topology.clientWidth / 2;
    const centerY = topology.clientHeight / 2;

    Object.keys(nodes).forEach(realm => {
      const node = nodes[realm];
      const o = orbitState[realm];

      if (!o) return;

      o.angle += o.speed;

      const x = centerX + Math.cos(o.angle) * o.radius;
      const y = centerY + Math.sin(o.angle) * o.radius;

      node.style.left = (x - node.clientWidth / 2) + "px";
      node.style.top = (y - node.clientHeight / 2) + "px";
    });

    requestAnimationFrame(updateOrbits);
  }
  updateOrbits();

  function drawLink(fromRealm, toRealm) {
    if (!nodes[fromRealm] || !nodes[toRealm]) return;

    const from = nodes[fromRealm].getBoundingClientRect();
    const to = nodes[toRealm].getBoundingClientRect();
    const topRect = topology.getBoundingClientRect();

    const x1 = from.left - topRect.left + from.width / 2;
    const y1 = from.top - topRect.top + from.height / 2;
    const x2 = to.left - topRect.left + to.width / 2;
    const y2 = to.top - topRect.top + to.height / 2;

    const dx = x2 - x1;
    const dy = y2 - y1;
    const length = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const link = document.createElement("div");
    link.className = "link";
    link.style.left = x1 + "px";
    link.style.top = y1 + "px";
    link.style.width = length + "px";
    link.style.transform = `rotate(${angle}deg)`;

    topology.appendChild(link);

    setTimeout(() => link.style.opacity = 0.1, 300);
    setTimeout(() => link.remove(), 1300);
  }

  function pulseRealm(realm) {
    if (!nodes[realm]) return;

    const node = nodes[realm];
    const rect = node.getBoundingClientRect();
    const topRect = topology.getBoundingClientRect();

    const x = rect.left - topRect.left + rect.width / 2;
    const y = rect.top - topRect.top + rect.height / 2;

    const pulse = document.createElement("div");
    pulse.className = "pulse";
    pulse.style.left = x + "px";
    pulse.style.top = y + "px";

    topology.appendChild(pulse);

    setTimeout(() => pulse.remove(), 800);
  }

  function updateRealmHealth() {
    realmHealthEl.innerHTML = "";
    const now = Date.now();

    Object.keys(realmStatus).forEach(realm => {
      const last = realmStatus[realm];
      const diff = now - last;
      const healthy = diff < 5000;

      const div = document.createElement("div");
      div.style.color = healthy ? "#4caf50" : "#f44336";
      div.textContent = `${realm}: ${healthy ? "healthy" : "offline"}`;
      realmHealthEl.appendChild(div);

      if (nodes[realm]) {
        nodes[realm].classList.toggle("offline", !healthy);
      }
    });
  }

  ws.onopen = () => {
    addEvent("cockpit", "status", { msg: "connected to bus" });
  };

  ws.onmessage = (msg) => {
    let event;
    try { event = JSON.parse(msg.data); } catch { return; }

    const { realm, type, data } = event;

    spawnNode(realm);

    if (data && data.targetRealm) {
      drawLink(realm, data.targetRealm);
    }

    if (type === "heartbeat") {
      realmStatus[realm] = Date.now();
      updateRealmHealth();
      pulseRealm(realm);
    }

    if (realm === "loop-manager" && type === "result") {
      if (data.loopDepth !== undefined) loopDepthEl.textContent = data.loopDepth;
      loopOkEl.textContent = data.ok ? "true" : "false";
    }

    addEvent(realm, type, data);
  };

  function addEvent(realm, type, data) {
    const div = document.createElement("div");
    div.className = `event ${type}`;
    div.innerHTML = `
      <strong>${realm} → ${type}</strong><br>
      <pre>${JSON.stringify(data, null, 2)}</pre>
    `;
    eventsDiv.appendChild(div);
    eventsDiv.scrollTop = eventsDiv.scrollHeight;
  }
</script>

</body>
</html>

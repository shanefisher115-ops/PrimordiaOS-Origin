services:
  app:
    build:
      context: .
      target: builder
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ./artifacts:/artifacts
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    tty: true
    stdin_open: true

  build:
    build:
      context: .
      target: builder
    command: sh -lc "npm run build | tee /artifacts/build.log"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ./artifacts:/artifacts
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  node_modules:
  next_cache:

# ==============================================================================
# Google Cloud Build Pipeline for PrimordiaOS Spatial Memory Engine
# Builds Docker container and deploys to Google Cloud Run
# ==============================================================================

steps:
  # 1. Build container image using Kaniko / Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spatial-memory-engine:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spatial-memory-engine:latest'
      - '.'
    id: 'build-spatial-memory-image'

  # 2. Push container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spatial-memory-engine:$COMMIT_SHA'
    id: 'push-spatial-memory-image'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spatial-memory-engine'
      - '--image=gcr.io/$PROJECT_ID/spatial-memory-engine:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,SPATIAL_MEMORY_PATH=/data/spatial-memory,REALM_MAP_PATH=/data/realm-map.json,PRIMORDIAOS_KEY=${_PRIMORDIAOS_KEY}'
    id: 'deploy-spatial-memory-cloudrun'

substitutions:
  _REGION: 'us-central1'
  _PRIMORDIAOS_KEY: 'PRIMORDIA_SOVEREIGN_TOKEN'

images:
  - 'gcr.io/$PROJECT_ID/spatial-memory-engine:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/spatial-memory-engine:latest'

options:
  logging: CLOUD_LOGGING_ONLY
